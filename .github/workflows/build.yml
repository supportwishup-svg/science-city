name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract zip and fix permissions
      run: |
        find . -name "*.zip" -exec unzip -o {} \;
        chmod -R ugo+rwX .
        ls -la

    - name: Build with Gradle
      run: |
        chmod -R ugo+rwX .
        TARGET_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
        echo "Building in directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: VoiceControl-App
        path: "**/build/outputs/apk/debug/*.apk"
